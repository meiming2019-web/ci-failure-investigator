[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-investigator"
version = "0.1.0"
description = "A read-only, evidence-driven agent for investigating deterministic CI failures."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.13,<3",
    "openai>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
packages = ["ci_failure_investigator"]
strict = true
